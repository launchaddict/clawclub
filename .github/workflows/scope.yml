# Optional: auto-scope raw charity requests into structured task drafts.
# Requires the ANTHROPIC_API_KEY repo secret; without it this workflow fails
# harmlessly and maintainers scope by hand (or via post_task in a session).
name: Auto-scope task request
on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'needs-scoping'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: node scripts/scope.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
